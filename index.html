<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>UVM Hierarchy Viewer</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family: Inter, system-ui, -apple-system,
               "Segoe UI", Arial, sans-serif;

  /* BLACK BACKGROUND */
  background: #000000;

  color: #ffffff;
}


/* ============================================================
   TOOLBAR
   ============================================================ */

#bar {
  height: 60px;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 9px 12px;

  background: #111111;
  border-bottom: 1px solid #333333;

  z-index: 10;
  position: relative;
}

button,
input {
  height: 40px;

  border: 1px solid #444444;
  background: #1c1c1c;

  border-radius: 8px;

  font: inherit;
  color: #ffffff;
}

button {
  padding: 0 12px;
  cursor: pointer;
  font-weight: 600;
}

button:hover {
  background: #2a2a2a;
}

#search {
  width: 280px;
  padding: 0 12px;
  outline: 0;
}

#search:focus {
  border-color: #6366f1;
  box-shadow: 0 0 0 3px #312e81;
}

#status {
  margin-left: auto;

  color: #aaaaaa;
  font-size: 13px;
}

/* ============================================================
   SEARCH
   ============================================================ */

#searchWrapper {
  position: relative;
}

#searchResults {

  display: none;

  position: absolute;

  top: 44px;

  left: 0;

  width: 320px;

  max-height: 300px;

  overflow-y: auto;

  background: #111111;

  border: 1px solid #444444;

  border-radius: 8px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.7);

  z-index: 1000;
}


.searchResult {

  padding: 10px 12px;

  color: #ffffff;

  font-size: 13px;

  font-weight: 600;

  cursor: pointer;

  border-bottom:
    1px solid #2a2a2a;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.searchResult:hover {

  background: #292929;

}


@media(max-width:480px) {

  #searchResults {

    width: 250px;

    max-height: 240px;

  }

}

/* ============================================================
   VIEWPORT
   ============================================================ */

#viewport {
  position: absolute;
  inset: 60px 0 0;

  overflow: hidden;

  cursor: grab;

  /*
   * Critical for mobile:
   * allows JavaScript to handle touch gestures.
   */
  touch-action: none;

  background-color: #000000;

  background-image:
    radial-gradient(
      #222222 1px,
      transparent 1px
    );

  background-size: 20px 20px;
}

#viewport.dragging {
  cursor: grabbing;
}


/* ============================================================
   SEARCH WRAPPER
   ============================================================ */

#searchWrapper {
  position: relative;
  z-index: 1000;
}

#search {
  width: 280px;
  height: 40px;

  padding: 0 12px;

  background: #1c1c1c;
  color: #ffffff;

  border: 1px solid #444444;
  border-radius: 8px;

  outline: none;
}

#search:focus {
  border-color: #6366f1;
}


/* ============================================================
   SEARCH RESULTS
   ============================================================ */

#searchResults {
  display: none;

  position: absolute;

  top: 44px;
  left: 0;

  width: 320px;

  max-height: 300px;

  overflow-y: auto;

  background: #111111;

  border: 1px solid #444444;

  border-radius: 8px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.8);

  z-index: 2000;

  /*
   * Allow scrolling the search results
   * on mobile.
   */
  touch-action: pan-y;
}


.searchResult {
  padding: 11px 13px;

  color: #ffffff;

  font-size: 13px;

  font-weight: 600;

  cursor: pointer;

  border-bottom:
    1px solid #2a2a2a;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  /*
   * Makes tapping easier on phones.
   */
  min-height: 42px;

  display: flex;
  align-items: center;
}


.searchResult:hover {
  background: #292929;
}

.searchResult:active {
  background: #3b3b3b;
}


/* ============================================================
   MOBILE TOOLBAR
   ============================================================ */

@media (max-width: 768px) {

  #bar {
    height: 56px;

    padding: 7px;

    gap: 5px;

    overflow: visible;

    white-space: nowrap;
  }

  #searchWrapper {
    flex: 1;

    min-width: 0;
  }

  #search {
    width: 100%;

    min-width: 0;

    height: 38px;

    font-size: 14px;
  }

  #searchResults {
    width: min(
      320px,
      calc(100vw - 20px)
    );

    max-height: 50vh;

    /*
     * Keep results inside the phone screen.
     */
    max-width: calc(100vw - 20px);
  }

  #viewport {
    inset: 56px 0 0;

    touch-action: none;
  }

}


/* ============================================================
   SMALL PHONES
   ============================================================ */

@media (max-width: 480px) {

  #bar {
    height: 52px;

    padding: 6px;
  }

  #search {
    height: 36px;

    font-size: 13px;
  }

  #searchResults {
    top: 41px;

    width: calc(100vw - 20px);

    max-height: 55vh;
  }

  #viewport {
    inset: 52px 0 0;
  }

  .desktop {
    display: none !important;
  }

}


/* ============================================================
   CONNECTIONS
   ============================================================ */

.edge {
  fill: none;

  /*
   * Light gray connectors are visible
   * against the black background.
   */
  stroke: #777777;

  stroke-width: 2;
}


/* ============================================================
   NODES
   ============================================================ */

.node {
  cursor: pointer;
}

/* White node box */
.box {
  fill: #ffffff;
  stroke: #777777;
  stroke-width: 1.5;
}

/* Hover */
.node:hover .box {
  fill: #ffffff;
  stroke: #6366f1;
  stroke-width: 2;
}

/* Selected node */
.node.selected .box {
  fill: #ffffff;
  stroke: #6366f1;
  stroke-width: 2.5;
}

/* Search match */
.node.match .box {
  fill: #ffffff;
  stroke: #22c55e;
  stroke-width: 3;
}


/* ============================================================
   UVM NODE NAME
   ============================================================ */

.label {
  fill: #000000;       /* BLACK TEXT */
  font-size: 14px;
  font-weight: 700;    /* BOLD */
  dominant-baseline: middle;
  pointer-events: none;
  white-space: nowrap;
}


/* ============================================================
   EXPAND / COLLAPSE BUTTON
   ============================================================ */

.toggle {
  fill: #6366f1;
  stroke: #ffffff;
  stroke-width: 2;
}

.toggleText {
  fill: #ffffff;
  font-size: 12px;
  font-weight: 700;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
}

/* ============================================================
   ERROR BOX
   ============================================================ */

#err {
  display: none;

  position: absolute;

  z-index: 20;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  background: #151515;

  border: 1px solid #ef4444;

  color: #fca5a5;

  padding: 18px 22px;

  border-radius: 10px;

  box-shadow:
    0 10px 35px rgba(0, 0, 0, 0.8);

  max-width: 620px;
}


/* ============================================================
   MOBILE
   ============================================================ */

@media(max-width:720px) {

  #search {
    width: 150px;
  }

  .desktop {
    display: none;
  }

  #status {
    display: none;
  }
}
</style>
</head>

<body>

<!-- =========================
     TOOLBAR
     ========================= -->

<div id="bar">

  <button onclick="zoomAtCenter(1.2)">
    +
  </button>

  <button onclick="zoomAtCenter(1/1.2)">
    −
  </button>

  <button onclick="fit()">
    Fit
  </button>

  <button onclick="resetView()">
    Reset
  </button>

  <div id="searchWrapper">

  <input
    id="search"
    placeholder="Search UVM class…"
    autocomplete="off"
  >

  <div id="searchResults"></div>

</div>

  <button
    onclick="expandAll()">
    Expand all
  </button>

  <button
    onclick="collapseAll()">
    Collapse all
  </button>

  <span id="status">
    Loading…
  </span>

</div>


<!-- =========================
     VIEWPORT
     ========================= -->

<div id="viewport">

  <div id="canvas">

    <svg id="tree"></svg>

  </div>

</div>


<div id="err"></div>


<script>
    /* ============================================================
   UVM HIERARCHY VIEWER
   FINAL JAVASCRIPT
   ============================================================ */

const XML_FILE = "UVM_Hierarchy.xml";

const MIN_W = 220;
const H = 48;
const HG = 90;
const VG = 24;

const MIN = 0.06;
const MAX = 4;


/* ============================================================
   GLOBAL STATE
   ============================================================ */

let root = null;
let all = [];

let zoom = 1;

let ox = 60;
let oy = 60;

let dragging = false;

let columnWidths = [];


/* ============================================================
   MOBILE / POINTER STATE
   ============================================================ */

let activePointers = new Map();

let lastPointerPosition = null;

let lastPinchDistance = null;

let lastPinchCenter = null;


/* ============================================================
   DOM REFERENCES
   ============================================================ */

const viewport =
  document.getElementById("viewport");

const canvas =
  document.getElementById("canvas");

const svg =
  document.getElementById("tree");

const searchInput =
  document.getElementById("search");

const searchResults =
  document.getElementById("searchResults");

const status =
  document.getElementById("status");

const errorBox =
  document.getElementById("err");


/* ============================================================
   ERROR DISPLAY
   ============================================================ */

function showError(message) {

  if (!errorBox) {
    alert(message);
    return;
  }

  errorBox.innerHTML = "";

  const messageElement =
    document.createElement("div");

  messageElement.textContent =
    message;

  errorBox.appendChild(
    messageElement
  );

  const hint =
    document.createElement("div");

  hint.style.marginTop = "8px";
  hint.style.fontSize = "12px";
  hint.style.color = "#999999";

  hint.textContent =
    "Make sure UVM_Hierarchy.xml is in the same folder as this HTML file.";

  errorBox.appendChild(hint);

  errorBox.style.display = "block";
}


/* ============================================================
   LOAD XML
   ============================================================ */

async function load() {

  try {

    const response =
      await fetch(XML_FILE);

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }

    let xmlText =
      await response.text();


    /*
     * Freeplane may contain &nbsp;.
     * DOMParser XML mode does not recognize it.
     */
    xmlText =
      xmlText.replace(
        /&nbsp;/g,
        " "
      );


    const parser =
      new DOMParser();


    const doc =
      parser.parseFromString(
        xmlText,
        "application/xml"
      );


    const parserError =
      doc.querySelector(
        "parsererror"
      );


    if (parserError) {

      throw new Error(
        "The XML could not be parsed."
      );

    }


    /*
     * First <node> is the hierarchy root.
     */
    const rootElement =
      doc.querySelector("node");


    if (!rootElement) {

      throw new Error(
        "No hierarchy node was found."
      );

    }


    root =
      parseNode(
        rootElement,
        null
      );


    all = [];

    collect(root);


    render();


    /*
     * Fit after browser has
     * calculated the SVG size.
     */
    setTimeout(
      fit,
      100
    );

  }
  catch (error) {

    console.error(error);

    showError(
      "Could not load UVM_Hierarchy.xml: " +
      error.message
    );

  }

}


/* ============================================================
   PARSE FREEPLANE NODE
   ============================================================ */

function parseNode(
  element,
  parent
) {

  const node = {

    id:
      element.getAttribute("ID") ||
      (
        "node_" +
        Math.random()
          .toString(36)
          .slice(2)
      ),

    text:
      element.getAttribute("TEXT") ||
      "(unnamed)",

    parent: parent,

    children: [],

    expanded:
      element.getAttribute("FOLDED") !== "true",

    width: MIN_W,

    height: H

  };


  /*
   * Only nested <node> elements
   * are part of the hierarchy.
   *
   * Freeplane metadata such as:
   *
   * hook
   * attribute
   * richcontent
   * map_styles
   * stylenode
   *
   * is ignored.
   */

  for (
    const child of element.children
  ) {

    if (
      child.tagName.toLowerCase() ===
      "node"
    ) {

      node.children.push(
        parseNode(
          child,
          node
        )
      );

    }

  }


  return node;

}


/* ============================================================
   COLLECT ALL NODES
   ============================================================ */

function collect(node) {

  all.push(node);

  node.children.forEach(
    child => collect(child)
  );

}


/* ============================================================
   GET VISIBLE NODES
   ============================================================ */

function visible() {

  const result = [];


  function walk(node) {

    result.push(node);


    if (node.expanded) {

      node.children.forEach(
        child => walk(child)
      );

    }

  }


  if (root) {
    walk(root);
  }


  return result;

}


/* ============================================================
   MEASURE NODE TEXT
   ============================================================ */

function measureTextWidth(text) {

  const measureCanvas =
    document.createElement(
      "canvas"
    );

  const ctx =
    measureCanvas.getContext(
      "2d"
    );


  /*
   * Must match .label CSS.
   *
   * 700 = bold.
   */
  ctx.font =
    '700 14px Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif';


  return Math.ceil(
    ctx.measureText(text).width
  );

}


/* ============================================================
   CALCULATE NODE SIZES
   ============================================================ */

function prepareNodeSizes() {

  columnWidths = [];


  all.forEach(node => {

    const textWidth =
      measureTextWidth(
        node.text
      );


    /*
     * 28px:
     * left + right padding
     *
     * 38px:
     * expand/collapse button
     */
    const toggleSpace =
      node.children.length
        ? 38
        : 0;


    node.width =
      Math.max(
        MIN_W,
        textWidth +
        28 +
        toggleSpace
      );


    node.height = H;

  });


  /*
   * Find maximum node width
   * at every hierarchy depth.
   */
  all.forEach(node => {

    let depth = 0;

    let parent =
      node.parent;


    while (parent) {

      depth++;

      parent =
        parent.parent;

    }


    columnWidths[depth] =
      Math.max(
        columnWidths[depth] || MIN_W,
        node.width
      );

  });

}


/* ============================================================
   TREE LAYOUT
   ============================================================ */

function layout() {

  const positions =
    new Map();

  let y = 0;


  /*
   * X coordinate for every
   * hierarchy depth.
   */
  const xByDepth = [];

  let x = 0;


  for (
    let depth = 0;
    depth < columnWidths.length;
    depth++
  ) {

    xByDepth[depth] = x;

    x +=
      columnWidths[depth] +
      HG;

  }


  function place(
    node,
    depth
  ) {

    /*
     * Expanded parent.
     */
    if (
      node.children.length &&
      node.expanded
    ) {

      const childYs =
        node.children.map(
          child =>
            place(
              child,
              depth + 1
            )
        );


      const parentY =
        (
          childYs[0] +
          childYs[
            childYs.length - 1
          ]
        ) / 2;


      positions.set(
        node.id,
        {
          x:
            xByDepth[depth],

          y:
            parentY,

          width:
            columnWidths[depth],

          height:
            H
        }
      );


      return parentY;

    }


    /*
     * Leaf or collapsed node.
     */
    const nodeY = y;

    y += H + VG;


    positions.set(
      node.id,
      {
        x:
          xByDepth[depth],

        y:
          nodeY,

        width:
          columnWidths[depth],

        height:
          H
      }
    );


    return nodeY;

  }


  place(
    root,
    0
  );


  return positions;

}


/* ============================================================
   RENDER
   ============================================================ */

function render() {

  svg.innerHTML = "";


  prepareNodeSizes();


  const nodes =
    visible();


  const positions =
    layout();


  /* ==========================================================
     DRAW CONNECTIONS
     ========================================================== */

  for (
    const node of nodes
  ) {

    if (!node.parent) {
      continue;
    }


    const parent =
      positions.get(
        node.parent.id
      );


    const child =
      positions.get(
        node.id
      );


    if (!parent || !child) {
      continue;
    }


    const path =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "path"
      );


    const x1 =
      parent.x +
      parent.width;


    const x2 =
      child.x;


    const middle =
      (x1 + x2) / 2;


    const y1 =
      parent.y +
      parent.height / 2;


    const y2 =
      child.y +
      child.height / 2;


    path.setAttribute(
      "d",
      `
      M ${x1} ${y1}
      C ${middle} ${y1},
        ${middle} ${y2},
        ${x2} ${y2}
      `
    );


    path.classList.add(
      "edge"
    );


    svg.appendChild(
      path
    );

  }


  /* ==========================================================
     DRAW NODES
     ========================================================== */

  for (
    const node of nodes
  ) {

    const position =
      positions.get(
        node.id
      );


    if (!position) {
      continue;
    }


    const group =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "g"
      );


    group.classList.add(
      "node"
    );


    group.dataset.id =
      node.id;


    /* ========================================================
       BOX
       ======================================================== */

    const rect =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "rect"
      );


    rect.setAttribute(
      "x",
      position.x
    );

    rect.setAttribute(
      "y",
      position.y
    );

    rect.setAttribute(
      "width",
      position.width
    );

    rect.setAttribute(
      "height",
      position.height
    );

    rect.setAttribute(
      "rx",
      9
    );


    rect.classList.add(
      "box"
    );


    group.appendChild(
      rect
    );


    /* ========================================================
       LABEL
       ======================================================== */

    const label =
      document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      );


    label.setAttribute(
      "x",
      position.x + 14
    );


    label.setAttribute(
      "y",
      position.y +
      position.height / 2
    );


    label.classList.add(
      "label"
    );


    /*
     * IMPORTANT:
     *
     * Full node name.
     * No truncation.
     */
    label.textContent =
      node.text;


    group.appendChild(
      label
    );


    /* ========================================================
       EXPAND / COLLAPSE
       ======================================================== */

    if (
      node.children.length
    ) {

      const circle =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "circle"
        );


      circle.setAttribute(
        "cx",
        position.x +
        position.width -
        16
      );


      circle.setAttribute(
        "cy",
        position.y +
        position.height / 2
      );


      circle.setAttribute(
        "r",
        9
      );


      circle.classList.add(
        "toggle"
      );


      group.appendChild(
        circle
      );


      const toggleText =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );


      toggleText.setAttribute(
        "x",
        position.x +
        position.width -
        16
      );


      toggleText.setAttribute(
        "y",
        position.y +
        position.height / 2
      );


      toggleText.classList.add(
        "toggleText"
      );


      toggleText.textContent =
        node.expanded
          ? "−"
          : "+";


      group.appendChild(
        toggleText
      );

    }


    /* ========================================================
       SINGLE CLICK
       ======================================================== */

    group.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        if (
          node.children.length
        ) {

          node.expanded =
            !node.expanded;


          render();

        }
        else {

          selectNode(
            node
          );

        }

      }
    );


    /* ========================================================
       DOUBLE CLICK
       ======================================================== */

    group.addEventListener(
      "dblclick",
      event => {

        event.stopPropagation();

        centerNode(
          node
        );

      }
    );


    svg.appendChild(
      group
    );

  }


  /* ==========================================================
     SVG SIZE
     ========================================================== */

  const values =
    [...positions.values()];


  const maxX =
    Math.max(
      100,
      ...values.map(
        p =>
          p.x + p.width
      )
    ) + 80;


  const maxY =
    Math.max(
      100,
      ...values.map(
        p =>
          p.y + p.height
      )
    ) + 80;


  svg.setAttribute(
    "width",
    maxX
  );


  svg.setAttribute(
    "height",
    maxY
  );


  svg.setAttribute(
    "viewBox",
    `0 0 ${maxX} ${maxY}`
  );


  if (status) {

    status.textContent =
      `${all.length} nodes`;

  }


  apply();

}


/* ============================================================
   SELECT NODE
   ============================================================ */

function selectNode(node) {

  document
    .querySelectorAll(".node")
    .forEach(element => {

      element.classList.remove(
        "selected"
      );

    });


  const element =
    document.querySelector(
      `[data-id="${CSS.escape(node.id)}"]`
    );


  if (element) {

    element.classList.add(
      "selected"
    );

  }


  if (status) {

    status.textContent =
      node.text;

  }

}


/* ============================================================
   EXPAND ALL
   ============================================================ */

function expandAll() {

  all.forEach(
    node => {
      node.expanded = true;
    }
  );


  render();


  setTimeout(
    fit,
    50
  );

}


/* ============================================================
   COLLAPSE ALL
   ============================================================ */

function collapseAll() {

  all.forEach(
    node => {
      node.expanded = false;
    }
  );


  /*
   * Keep root visible.
   */
  if (root) {
    root.expanded = true;
  }


  render();


  setTimeout(
    fit,
    50
  );

}


/* ============================================================
   SEARCH
   ============================================================ */

if (searchInput) {

  searchInput.addEventListener(
    "input",
    handleSearch
  );

}


/* ============================================================
   HANDLE SEARCH
   ============================================================ */

function handleSearch() {

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  /*
   * Clear results.
   */
  searchResults.innerHTML = "";


  /*
   * Remove previous highlights.
   */
  document
    .querySelectorAll(".node")
    .forEach(element => {

      element.classList.remove(
        "match"
      );

    });


  if (!query) {

    searchResults.style.display =
      "none";

    return;

  }


  const matches =
    all.filter(
      node =>
        node.text
          .toLowerCase()
          .includes(query)
    );


  /* ==========================================================
     NO RESULTS
     ========================================================== */

  if (!matches.length) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "searchResult";


    empty.textContent =
      "No matching node";


    empty.style.color =
      "#999999";


    searchResults.appendChild(
      empty
    );


    searchResults.style.display =
      "block";


    return;

  }


  /* ==========================================================
     SEARCH RESULTS
     ========================================================== */

  matches.forEach(
    node => {

      const result =
        document.createElement(
          "div"
        );


      result.className =
        "searchResult";


      result.textContent =
        node.text;


      /*
       * Tap/click search result.
       */
      result.addEventListener(
        "click",
        event => {

          event.preventDefault();

          event.stopPropagation();

          goToNode(
            node
          );

        }
      );


      /*
       * Mobile touch.
       */
      result.addEventListener(
        "pointerup",
        event => {

          event.preventDefault();

          event.stopPropagation();

          goToNode(
            node
          );

        }
      );


      searchResults.appendChild(
        result
      );

    }
  );


  searchResults.style.display =
    "block";

}


/* ============================================================
   GO TO SEARCHED NODE
   ============================================================ */

function goToNode(node) {

  /*
   * Expand all ancestors.
   */
  let parent =
    node.parent;


  while (parent) {

    parent.expanded =
      true;

    parent =
      parent.parent;

  }


  /*
   * Re-render so the node becomes visible.
   */
  render();


  /*
   * Give SVG time to update.
   */
  setTimeout(
    () => {

      /*
       * Center the selected node.
       */
      centerNode(
        node
      );


      /*
       * Highlight it.
       */
      const element =
        document.querySelector(
          `[data-id="${CSS.escape(node.id)}"]`
        );


      if (element) {

        element.classList.add(
          "selected"
        );

      }


      /*
       * Close results.
       */
      searchResults.style.display =
        "none";


      /*
       * Keep selected node name
       * in search box.
       */
      searchInput.value =
        node.text;

    },
    50
  );

}


/* ============================================================
   APPLY TRANSFORM
   ============================================================ */

function apply() {

  canvas.style.transform =
    `translate(${ox}px, ${oy}px) scale(${zoom})`;

}


/* ============================================================
   NORMAL ZOOM
   ============================================================ */

function zoomAtCenter(
  factor
) {

  const viewportWidth =
    viewport.clientWidth;

  const viewportHeight =
    viewport.clientHeight;


  zoom =
    Math.max(
      MIN,
      Math.min(
        MAX,
        zoom * factor
      )
    );


  /*
   * Keep zoom centered around
   * screen center.
   */
  const centerX =
    viewportWidth / 2;

  const centerY =
    viewportHeight / 2;


  apply();

}


/* ============================================================
   ZOOM AROUND TOUCH POINT
   ============================================================ */

function zoomAroundPoint(
  factor,
  screenX,
  screenY
) {

  const oldZoom =
    zoom;


  zoom =
    Math.max(
      MIN,
      Math.min(
        MAX,
        zoom * factor
      )
    );


  const zoomChange =
    zoom / oldZoom;


  /*
   * Keep the content beneath
   * the fingers stationary.
   */
  ox =
    screenX -
    (
      screenX - ox
    ) *
    zoomChange;


  oy =
    screenY -
    (
      screenY - oy
    ) *
    zoomChange;


  apply();

}


/* ============================================================
   FIT TO SCREEN
   ============================================================ */

function fit() {

  const width =
    parseFloat(
      svg.getAttribute(
        "width"
      )
    ) || 1;


  const height =
    parseFloat(
      svg.getAttribute(
        "height"
      )
    ) || 1;


  const viewportWidth =
    viewport.clientWidth;


  const viewportHeight =
    viewport.clientHeight;


  /*
   * Leave some margin.
   */
  const horizontalMargin =
    40;

  const verticalMargin =
    40;


  zoom =
    Math.max(
      MIN,
      Math.min(
        1,
        Math.min(
          (
            viewportWidth -
            horizontalMargin
          ) / width,

          (
            viewportHeight -
            verticalMargin
          ) / height
        )
      )
    );


  ox =
    (
      viewportWidth -
      width * zoom
    ) / 2;


  oy =
    (
      viewportHeight -
      height * zoom
    ) / 2;


  apply();

}


/* ============================================================
   RESET VIEW
   ============================================================ */

function resetView() {

  zoom = 1;

  ox = 60;

  oy = 60;

  apply();

}


/* ============================================================
   CENTER NODE
   ============================================================ */

function centerNode(node) {

  const element =
    document.querySelector(
      `[data-id="${CSS.escape(node.id)}"]`
    );


  if (!element) {
    return;
  }


  /*
   * Use SVG bounding box rather than
   * browser-scaled bounding rectangle.
   */
  const position =
    element.getBBox();


  const viewportWidth =
    viewport.clientWidth;


  const viewportHeight =
    viewport.clientHeight;


  /*
   * Current canvas coordinates
   * of node center.
   */
  const nodeX =
    position.x +
    position.width / 2;


  const nodeY =
    position.y +
    position.height / 2;


  /*
   * Center node in viewport.
   */
  ox =
    viewportWidth / 2 -
    nodeX * zoom;


  oy =
    viewportHeight / 2 -
    nodeY * zoom;


  apply();


  selectNode(
    node
  );

}


/* ============================================================
   MOUSE WHEEL ZOOM
   ============================================================ */

viewport.addEventListener(
  "wheel",
  event => {

    /*
     * Prevent page scrolling.
     */
    event.preventDefault();


    /*
     * Zoom around mouse position.
     */
    const rect =
      viewport.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    const factor =
      event.deltaY < 0
        ? 1.15
        : 1 / 1.15;


    zoomAroundPoint(
      factor,
      x,
      y
    );

  },
  {
    passive: false
  }
);


/* ============================================================
   POINTER DOWN
   ============================================================ */

viewport.addEventListener(
  "pointerdown",
  event => {

    /*
     * Search UI must remain independent
     * from viewport gestures.
     */
    if (
      event.target.closest(
        "#searchWrapper"
      )
    ) {
      return;
    }


    /*
     * Node click should be handled
     * by the node itself.
     */
    if (
      event.target.closest(
        ".node"
      )
    ) {
      return;
    }


    activePointers.set(
      event.pointerId,
      {
        x: event.clientX,
        y: event.clientY
      }
    );


    viewport.setPointerCapture(
      event.pointerId
    );


    /* ========================================================
       TWO FINGERS
       ======================================================== */

    if (
      activePointers.size === 2
    ) {

      lastPinchDistance =
        getPinchDistance();


      lastPinchCenter =
        getPinchCenter();


      lastPointerPosition =
        null;


      dragging = false;


      viewport.classList.remove(
        "dragging"
      );


      return;

    }


    /* ========================================================
       ONE FINGER
       ======================================================== */

    lastPointerPosition = {

      x:
        event.clientX,

      y:
        event.clientY

    };


    dragging = true;


    viewport.classList.add(
      "dragging"
    );

  }
);


/* ============================================================
   POINTER MOVE
   ============================================================ */

viewport.addEventListener(
  "pointermove",
  event => {

    if (
      !activePointers.has(
        event.pointerId
      )
    ) {
      return;
    }


    /*
     * Update pointer.
     */
    activePointers.set(
      event.pointerId,
      {
        x: event.clientX,
        y: event.clientY
      }
    );


    /* ========================================================
       TWO-FINGER PINCH
       ======================================================== */

    if (
      activePointers.size === 2
    ) {

      const distance =
        getPinchDistance();


      const center =
        getPinchCenter();


      if (
        lastPinchDistance &&
        distance &&
        center
      ) {

        const scale =
          distance /
          lastPinchDistance;


        /*
         * Limit extremely large
         * pointer jumps.
         */
        const safeScale =
          Math.max(
            0.85,
            Math.min(
              1.15,
              scale
            )
          );


        zoomAroundPoint(
          safeScale,
          center.x,
          center.y
        );


        /*
         * Also pan with the midpoint
         * of the two fingers.
         */
        if (
          lastPinchCenter
        ) {

          ox +=
            center.x -
            lastPinchCenter.x;


          oy +=
            center.y -
            lastPinchCenter.y;


          apply();

        }

      }


      lastPinchDistance =
        distance;


      lastPinchCenter =
        center;


      return;

    }


    /* ========================================================
       ONE-FINGER PAN
       ======================================================== */

    if (
      activePointers.size === 1 &&
      dragging &&
      lastPointerPosition
    ) {

      const dx =
        event.clientX -
        lastPointerPosition.x;


      const dy =
        event.clientY -
        lastPointerPosition.y;


      ox += dx;

      oy += dy;


      lastPointerPosition = {

        x:
          event.clientX,

        y:
          event.clientY

      };


      apply();

    }

  }
);


/* ============================================================
   POINTER UP
   ============================================================ */

viewport.addEventListener(
  "pointerup",
  event => {

    activePointers.delete(
      event.pointerId
    );


    /*
     * Reset gesture state.
     */
    if (
      activePointers.size < 2
    ) {

      lastPinchDistance =
        null;

      lastPinchCenter =
        null;

    }


    if (
      activePointers.size === 0
    ) {

      dragging = false;

      lastPointerPosition =
        null;


      viewport.classList.remove(
        "dragging"
      );

    }

  }
);


/* ============================================================
   POINTER CANCEL
   ============================================================ */

viewport.addEventListener(
  "pointercancel",
  event => {

    activePointers.delete(
      event.pointerId
    );


    if (
      activePointers.size < 2
    ) {

      lastPinchDistance =
        null;

      lastPinchCenter =
        null;

    }


    if (
      activePointers.size === 0
    ) {

      dragging = false;

      lastPointerPosition =
        null;


      viewport.classList.remove(
        "dragging"
      );

    }

  }
);


/* ============================================================
   PINCH DISTANCE
   ============================================================ */

function getPinchDistance() {

  const points =
    [...activePointers.values()];


  if (
    points.length < 2
  ) {
    return null;
  }


  const dx =
    points[0].x -
    points[1].x;


  const dy =
    points[0].y -
    points[1].y;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* ============================================================
   PINCH CENTER
   ============================================================ */

function getPinchCenter() {

  const points =
    [...activePointers.values()];


  if (
    points.length < 2
  ) {
    return null;
  }


  return {

    x:
      (
        points[0].x +
        points[1].x
      ) / 2,

    y:
      (
        points[0].y +
        points[1].y
      ) / 2

  };

}


/* ============================================================
   CLOSE SEARCH WHEN CLICKING OUTSIDE
   ============================================================ */

document.addEventListener(
  "pointerdown",
  event => {

    if (
      !event.target.closest(
        "#searchWrapper"
      )
    ) {

      if (searchResults) {

        searchResults.style.display =
          "none";

      }

    }

  }
);


/* ============================================================
   WINDOW RESIZE
   ============================================================ */

window.addEventListener(
  "resize",
  () => {

    /*
     * Re-render because mobile
     * dimensions may have changed.
     */
    render();

  }
);


/* ============================================================
   START APPLICATION
   ============================================================ */

load();

</script>
