<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>UVM Hierarchy Viewer</title>


<style>

/* ============================================================
   GLOBAL
   ============================================================ */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #000;

  color: #fff;

}


/* ============================================================
   TOOLBAR
   ============================================================ */

#bar {

  position: relative;

  z-index: 1000;

  min-height: 60px;

  display: flex;

  align-items: center;

  gap: 7px;

  padding: 8px 10px;

  background: #111;

  border-bottom: 1px solid #333;

}


/* ============================================================
   BUTTONS
   ============================================================ */

#bar button {

  height: 40px;

  padding: 0 12px;

  border: 1px solid #444;

  border-radius: 8px;

  background: #1c1c1c;

  color: #fff;

  font-family: inherit;

  font-size: 13px;

  font-weight: 600;

  cursor: pointer;

  white-space: nowrap;

  flex-shrink: 0;

  -webkit-tap-highlight-color: transparent;

}


#bar button:hover {

  background: #2a2a2a;

}


#bar button:active {

  background: #383838;

}


/* ============================================================
   SEARCH
   ============================================================ */

#searchWrapper {

  position: relative;

  flex: 1;

  min-width: 150px;

  z-index: 2000;

}


#search {

  width: 100%;

  height: 40px;

  padding: 0 12px;

  border: 1px solid #444;

  border-radius: 8px;

  outline: none;

  background: #1c1c1c;

  color: #fff;

  font-family: inherit;

  font-size: 14px;

}


#search::placeholder {

  color: #888;

}


#search:focus {

  border-color: #6366f1;

  box-shadow:
    0 0 0 2px
    rgba(99,102,241,.2);

}


/* ============================================================
   SEARCH RESULTS
   ============================================================ */

#searchResults {

  display: none;

  position: absolute;

  top: calc(100% + 5px);

  left: 0;

  width: 100%;

  max-height: 300px;

  overflow-y: auto;

  background: #111;

  border: 1px solid #444;

  border-radius: 8px;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.8);

  z-index: 9999;

  touch-action: pan-y;

  -webkit-overflow-scrolling: touch;

}


.searchResult {

  min-height: 44px;

  display: flex;

  align-items: center;

  padding: 9px 12px;

  border-bottom:
    1px solid #292929;

  color: #fff;

  font-size: 13px;

  font-weight: 600;

  cursor: pointer;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  -webkit-tap-highlight-color:
    transparent;

}


.searchResult:last-child {

  border-bottom: none;

}


.searchResult:hover {

  background: #292929;

}


.searchResult:active {

  background: #3a3a3a;

}


/* ============================================================
   STATUS
   ============================================================ */

#status {

  color: #999;

  font-size: 12px;

  white-space: nowrap;

  margin-left: auto;

  flex-shrink: 0;

}


/* ============================================================
   VIEWPORT
   ============================================================ */

#viewport {

  position: absolute;

  top: 60px;

  right: 0;

  bottom: 0;

  left: 0;

  overflow: hidden;

  background: #000;

  background-image:
    radial-gradient(
      #222 1px,
      transparent 1px
    );

  background-size: 20px 20px;

  /*
   * JavaScript handles
   * all touch gestures.
   */

  touch-action: none;

  overscroll-behavior: none;

  cursor: grab;

  user-select: none;

  -webkit-user-select: none;

  -webkit-touch-callout: none;

}


#viewport.dragging {

  cursor: grabbing;

}


/* ============================================================
   CANVAS
   ============================================================ */

#canvas {

  position: absolute;

  left: 0;

  top: 0;

  transform-origin: 0 0;

  will-change: transform;

  backface-visibility: hidden;

}


svg {

  overflow: visible;

}


/* ============================================================
   CONNECTIONS
   ============================================================ */

.edge {

  fill: none;

  stroke: #777;

  stroke-width: 2;

  vector-effect:
    non-scaling-stroke;

  pointer-events: none;

}


/* ============================================================
   NODES
   ============================================================ */

.node {

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;

}


.box {

  fill: #fff;

  stroke: #777;

  stroke-width: 1.5;

}


.node:hover .box {

  fill: #fff;

  stroke: #6366f1;

  stroke-width: 2;

}


.node.selected .box {

  fill: #fff;

  stroke: #6366f1;

  stroke-width: 3;

}


.node.match .box {

  fill: #fff;

  stroke: #22c55e;

  stroke-width: 3;

}


/* ============================================================
   NODE NAME
   ============================================================ */

.label {

  fill: #000;

  font-size: 14px;

  font-weight: 700;

  dominant-baseline: middle;

  pointer-events: none;

  white-space: nowrap;

}


/* ============================================================
   EXPAND / COLLAPSE
   ============================================================ */

.toggle {

  fill: #6366f1;

  stroke: #fff;

  stroke-width: 2;

}


.toggleText {

  fill: #fff;

  font-size: 12px;

  font-weight: 700;

  text-anchor: middle;

  dominant-baseline: central;

  pointer-events: none;

}


/* ============================================================
   ERROR
   ============================================================ */

#err {

  display: none;

  position: absolute;

  z-index: 10000;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  width:
    min(600px, calc(100vw - 30px));

  padding: 18px;

  background: #151515;

  border: 1px solid #ef4444;

  border-radius: 10px;

  color: #fca5a5;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.8);

}


/* ============================================================
   TABLET
   ============================================================ */

@media (max-width: 768px) {

  #bar {

    min-height: 104px;

    height: auto;

    display: grid;

    grid-template-columns:
      auto
      auto
      1fr
      auto
      auto;

    grid-template-rows:
      40px
      40px;

    gap: 6px;

    padding: 7px;

    overflow: visible;

  }


  #searchWrapper {

    grid-column: 3;

    grid-row: 1;

    min-width: 0;

  }


  #search {

    height: 40px;

    font-size: 13px;

  }


  #bar button {

    height: 40px;

    padding: 0 9px;

    font-size: 12px;

  }


  #searchResults {

    width:
      min(360px,
      calc(100vw - 14px));

    max-height: 50vh;

  }


  #status {

    display: none;

  }


  #viewport {

    top: 104px;

  }

}


/* ============================================================
   MOBILE PHONE
   ============================================================ */

@media (max-width: 480px) {

  #bar {

    min-height: 112px;

    grid-template-columns:
      38px
      38px
      1fr
      52px
      52px;

    grid-template-rows:
      38px
      38px;

    gap: 5px;

    padding: 6px;

  }


  #zoomIn {

    grid-column: 1;

    grid-row: 1;

  }


  #zoomOut {

    grid-column: 2;

    grid-row: 1;

  }


  #searchWrapper {

    grid-column: 3;

    grid-row: 1;

  }


  #fitButton {

    grid-column: 4;

    grid-row: 1;

  }


  #resetButton {

    grid-column: 5;

    grid-row: 1;

  }


  #expandButton {

    grid-column: 3;

    grid-row: 2;

  }


  #collapseButton {

    grid-column: 4 / 6;

    grid-row: 2;

  }


  #bar button {

    height: 38px;

    padding: 0 6px;

    font-size: 11px;

  }


  #search {

    height: 38px;

    padding: 0 8px;

    font-size: 12px;

  }


  #searchResults {

    top: 43px;

    left: 50%;

    transform:
      translateX(-50%);

    width:
      calc(100vw - 12px);

    max-width:
      calc(100vw - 12px);

    max-height: 55vh;

  }


  #viewport {

    top: 112px;

  }

}


/* ============================================================
   VERY SMALL PHONES
   ============================================================ */

@media (max-width: 360px) {

  #bar {

    grid-template-columns:
      34px
      34px
      1fr
      46px
      46px;

    gap: 4px;

    padding: 5px;

  }


  #bar button {

    font-size: 10px;

    padding: 0 4px;

  }


  #search {

    font-size: 11px;

    padding: 0 6px;

  }

}

</style>

</head>


<body>


<!-- ==========================================================
     TOOLBAR
     ========================================================== -->

<div id="bar">


  <button
    id="zoomIn"
    onclick="zoomAtCenter(1.2)"
  >
    +
  </button>


  <button
    id="zoomOut"
    onclick="zoomAtCenter(1 / 1.2)"
  >
    −
  </button>


  <div id="searchWrapper">

    <input
      id="search"
      type="search"
      placeholder="Search UVM..."
      autocomplete="off"
    >

    <div id="searchResults"></div>

  </div>


  <button
    id="fitButton"
    onclick="fit()"
  >
    Fit
  </button>


  <button
    id="resetButton"
    onclick="resetView()"
  >
    Reset
  </button>


  <button
    id="expandButton"
    onclick="expandAll()"
  >
    Expand All
  </button>


  <button
    id="collapseButton"
    onclick="collapseAll()"
  >
    Collapse All
  </button>


  <span id="status">
    Loading...
  </span>

</div>


<!-- ==========================================================
     VIEWPORT
     ========================================================== -->

<div id="viewport">

  <div id="canvas">

    <svg id="tree"></svg>

  </div>

</div>


<!-- ==========================================================
     ERROR
     ========================================================== -->

<div id="err"></div>


<script>

/* ============================================================
   CONFIGURATION
   ============================================================ */

const XML_FILE =
  "UVM_Hierarchy.xml";


const MIN_W = 220;

const H = 48;

const HG = 90;

const VG = 24;


const MIN_ZOOM = 0.06;

const MAX_ZOOM = 4;


/* ============================================================
   STATE
   ============================================================ */

let root = null;

let all = [];

let columnWidths = [];


let zoom = 1;

let ox = 60;

let oy = 60;


/* ============================================================
   POINTER STATE
   ============================================================ */

const pointers =
  new Map();


let lastPanPoint = null;

let lastPinchDistance = null;

let lastPinchCenter = null;

let isDragging = false;


/* ============================================================
   ANIMATION
   ============================================================ */

let transformFrame = null;


/* ============================================================
   DOM
   ============================================================ */

const viewport =
  document.getElementById(
    "viewport"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const svg =
  document.getElementById(
    "tree"
  );


const searchInput =
  document.getElementById(
    "search"
  );


const searchResults =
  document.getElementById(
    "searchResults"
  );


const status =
  document.getElementById(
    "status"
  );


const errorBox =
  document.getElementById(
    "err"
  );


/* ============================================================
   APPLY TRANSFORM
   ============================================================ */

function apply() {

  if (transformFrame) {

    return;

  }


  transformFrame =
    requestAnimationFrame(
      () => {

        canvas.style.transform =
          `translate3d(
            ${ox}px,
            ${oy}px,
            0
          )
          scale(${zoom})`;


        transformFrame = null;

      }
    );

}


/* ============================================================
   ERROR
   ============================================================ */

function showError(message) {

  if (!errorBox) {

    alert(message);

    return;

  }


  errorBox.innerHTML = "";


  const msg =
    document.createElement(
      "div"
    );


  msg.textContent =
    message;


  errorBox.appendChild(
    msg
  );


  const hint =
    document.createElement(
      "div"
    );


  hint.style.marginTop =
    "8px";


  hint.style.fontSize =
    "12px";


  hint.style.color =
    "#999";


  hint.textContent =
    "Make sure UVM_Hierarchy.xml is in the same folder as this HTML file.";


  errorBox.appendChild(
    hint
  );


  errorBox.style.display =
    "block";

}


/* ============================================================
   LOAD XML
   ============================================================ */

async function load() {

  try {

    const response =
      await fetch(
        XML_FILE
      );


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    let xmlText =
      await response.text();


    /*
     * Freeplane can contain &nbsp;.
     */
    xmlText =
      xmlText.replace(
        /&nbsp;/g,
        " "
      );


    const parser =
      new DOMParser();


    const doc =
      parser.parseFromString(
        xmlText,
        "application/xml"
      );


    const parserError =
      doc.querySelector(
        "parsererror"
      );


    if (parserError) {

      throw new Error(
        "Invalid XML"
      );

    }


    const rootElement =
      doc.querySelector(
        "node"
      );


    if (!rootElement) {

      throw new Error(
        "No <node> hierarchy found"
      );

    }


    root =
      parseNode(
        rootElement,
        null
      );


    all = [];


    collect(root);


    render();


    setTimeout(
      fit,
      100
    );

  }
  catch (error) {

    console.error(
      error
    );


    showError(
      "Could not load UVM_Hierarchy.xml: " +
      error.message
    );

  }

}


/* ============================================================
   PARSE FREEPLANE NODE
   ============================================================ */

function parseNode(
  element,
  parent
) {

  const node = {

    id:
      element.getAttribute(
        "ID"
      ) ||
      (
        "node_" +
        Math.random()
          .toString(36)
          .slice(2)
      ),


    text:
      element.getAttribute(
        "TEXT"
      ) ||
      "(unnamed)",


    parent:
      parent,


    children: [],


    expanded:
      element.getAttribute(
        "FOLDED"
      ) !== "true",


    width:
      MIN_W,


    height:
      H

  };


  /*
   * Only nested <node> elements
   * form the hierarchy.
   */
  for (
    const child of
    element.children
  ) {

    if (
      child.tagName.toLowerCase() ===
      "node"
    ) {

      node.children.push(
        parseNode(
          child,
          node
        )
      );

    }

  }


  return node;

}


/* ============================================================
   COLLECT
   ============================================================ */

function collect(node) {

  all.push(node);


  node.children.forEach(
    child =>
      collect(child)
  );

}


/* ============================================================
   VISIBLE NODES
   ============================================================ */

function visible() {

  const result = [];


  function walk(node) {

    result.push(node);


    if (
      node.expanded
    ) {

      node.children.forEach(
        child =>
          walk(child)
      );

    }

  }


  if (root) {

    walk(root);

  }


  return result;

}


/* ============================================================
   MEASURE TEXT
   ============================================================ */

function measureTextWidth(
  text
) {

  const c =
    document.createElement(
      "canvas"
    );


  const ctx =
    c.getContext(
      "2d"
    );


  /*
   * Bold font.
   */
  ctx.font =
    '700 14px Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif';


  return Math.ceil(
    ctx.measureText(
      text
    ).width
  );

}


/* ============================================================
   NODE SIZES
   ============================================================ */

function prepareNodeSizes() {

  columnWidths = [];


  all.forEach(
    node => {

      const textWidth =
        measureTextWidth(
          node.text
        );


      const toggleSpace =
        node.children.length
          ? 38
          : 0;


      node.width =
        Math.max(
          MIN_W,

          textWidth +
          28 +
          toggleSpace
        );


      node.height =
        H;

    }
  );


  all.forEach(
    node => {

      let depth = 0;

      let parent =
        node.parent;


      while (parent) {

        depth++;

        parent =
          parent.parent;

      }


      columnWidths[depth] =
        Math.max(
          columnWidths[depth] ||
          MIN_W,

          node.width
        );

    }
  );

}


/* ============================================================
   LAYOUT
   ============================================================ */

function layout() {

  const positions =
    new Map();


  let y = 0;


  const xByDepth = [];


  let x = 0;


  for (
    let depth = 0;
    depth < columnWidths.length;
    depth++
  ) {

    xByDepth[depth] =
      x;


    x +=
      columnWidths[depth] +
      HG;

  }


  function place(
    node,
    depth
  ) {

    if (
      node.children.length &&
      node.expanded
    ) {

      const childYs =
        node.children.map(
          child =>
            place(
              child,
              depth + 1
            )
        );


      const parentY =
        (
          childYs[0] +
          childYs[
            childYs.length - 1
          ]
        ) / 2;


      positions.set(
        node.id,
        {

          x:
            xByDepth[depth],

          y:
            parentY,

          width:
            columnWidths[depth],

          height:
            H

        }
      );


      return parentY;

    }


    const nodeY =
      y;


    y +=
      H + VG;


    positions.set(
      node.id,
      {

        x:
          xByDepth[depth],

        y:
          nodeY,

        width:
          columnWidths[depth],

        height:
          H

      }
    );


    return nodeY;

  }


  place(
    root,
    0
  );


  return positions;

}


/* ============================================================
   RENDER
   ============================================================ */

function render() {

  svg.innerHTML =
    "";


  prepareNodeSizes();


  const nodes =
    visible();


  const positions =
    layout();


  /* ==========================================================
     EDGES
     ========================================================== */

  nodes.forEach(
    node => {

      if (!node.parent) {

        return;

      }


      const parent =
        positions.get(
          node.parent.id
        );


      const child =
        positions.get(
          node.id
        );


      if (
        !parent ||
        !child
      ) {

        return;

      }


      const path =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "path"
        );


      const x1 =
        parent.x +
        parent.width;


      const x2 =
        child.x;


      const middle =
        (x1 + x2) / 2;


      const y1 =
        parent.y +
        parent.height / 2;


      const y2 =
        child.y +
        child.height / 2;


      path.setAttribute(
        "d",
        `
        M ${x1} ${y1}
        C ${middle} ${y1},
          ${middle} ${y2},
          ${x2} ${y2}
        `
      );


      path.classList.add(
        "edge"
      );


      svg.appendChild(
        path
      );

    }
  );


  /* ==========================================================
     NODES
     ========================================================== */

  nodes.forEach(
    node => {

      const p =
        positions.get(
          node.id
        );


      if (!p) {

        return;

      }


      const group =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "g"
        );


      group.classList.add(
        "node"
      );


      group.dataset.id =
        node.id;


      /* ------------------------------------------------------
         BOX
         ------------------------------------------------------ */

      const rect =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "rect"
        );


      rect.setAttribute(
        "x",
        p.x
      );


      rect.setAttribute(
        "y",
        p.y
      );


      rect.setAttribute(
        "width",
        p.width
      );


      rect.setAttribute(
        "height",
        p.height
      );


      rect.setAttribute(
        "rx",
        9
      );


      rect.classList.add(
        "box"
      );


      group.appendChild(
        rect
      );


      /* ------------------------------------------------------
         TEXT
         ------------------------------------------------------ */

      const label =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text"
        );


      label.setAttribute(
        "x",
        p.x + 14
      );


      label.setAttribute(
        "y",
        p.y +
        p.height / 2
      );


      label.classList.add(
        "label"
      );


      /*
       * Full name.
       *
       * No truncation.
       */
      label.textContent =
        node.text;


      group.appendChild(
        label
      );


      /* ------------------------------------------------------
         EXPAND BUTTON
         ------------------------------------------------------ */

      if (
        node.children.length
      ) {

        const circle =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
          );


        circle.setAttribute(
          "cx",
          p.x +
          p.width -
          16
        );


        circle.setAttribute(
          "cy",
          p.y +
          p.height / 2
        );


        circle.setAttribute(
          "r",
          9
        );


        circle.classList.add(
          "toggle"
        );


        group.appendChild(
          circle
        );


        const toggleText =
          document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
          );


        toggleText.setAttribute(
          "x",
          p.x +
          p.width -
          16
        );


        toggleText.setAttribute(
          "y",
          p.y +
          p.height / 2
        );


        toggleText.classList.add(
          "toggleText"
        );


        toggleText.textContent =
          node.expanded
            ? "−"
            : "+";


        group.appendChild(
          toggleText
        );

      }


      /* ------------------------------------------------------
         CLICK
         ------------------------------------------------------ */

      group.addEventListener(
        "click",
        event => {

          event.stopPropagation();


          if (
            node.children.length
          ) {

            node.expanded =
              !node.expanded;


            render();

          }
          else {

            selectNode(
              node
            );

          }

        }
      );


      /* ------------------------------------------------------
         DOUBLE CLICK
         ------------------------------------------------------ */

      group.addEventListener(
        "dblclick",
        event => {

          event.stopPropagation();


          centerNode(
            node
          );

        }
      );


      svg.appendChild(
        group
      );

    }
  );


  /* ==========================================================
     SVG SIZE
     ========================================================== */

  const values =
    [...positions.values()];


  const maxX =
    Math.max(
      100,

      ...values.map(
        p =>
          p.x +
          p.width
      )
    ) + 80;


  const maxY =
    Math.max(
      100,

      ...values.map(
        p =>
          p.y +
          p.height
      )
    ) + 80;


  svg.setAttribute(
    "width",
    maxX
  );


  svg.setAttribute(
    "height",
    maxY
  );


  svg.setAttribute(
    "viewBox",
    `0 0 ${maxX} ${maxY}`
  );


  if (status) {

    status.textContent =
      `${all.length} nodes`;

  }


  apply();

}


/* ============================================================
   SELECT NODE
   ============================================================ */

function selectNode(node) {

  document
    .querySelectorAll(
      ".node"
    )
    .forEach(
      element => {

        element.classList.remove(
          "selected"
        );

      }
    );


  const element =
    document.querySelector(
      `[data-id="${CSS.escape(node.id)}"]`
    );


  if (element) {

    element.classList.add(
      "selected"
    );

  }


  if (status) {

    status.textContent =
      node.text;

  }

}


/* ============================================================
   EXPAND ALL
   ============================================================ */

function expandAll() {

  all.forEach(
    node => {

      node.expanded =
        true;

    }
  );


  render();


  setTimeout(
    fit,
    50
  );

}


/* ============================================================
   COLLAPSE ALL
   ============================================================ */

function collapseAll() {

  all.forEach(
    node => {

      node.expanded =
        false;

    }
  );


  if (root) {

    root.expanded =
      true;

  }


  render();


  setTimeout(
    fit,
    50
  );

}


/* ============================================================
   SEARCH
   ============================================================ */

searchInput.addEventListener(
  "input",
  handleSearch
);


function handleSearch() {

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  searchResults.innerHTML =
    "";


  document
    .querySelectorAll(
      ".node"
    )
    .forEach(
      element => {

        element.classList.remove(
          "match"
        );

      }
    );


  if (!query) {

    searchResults.style.display =
      "none";

    return;

  }


  const matches =
    all.filter(
      node =>
        node.text
          .toLowerCase()
          .includes(query)
    );


  if (!matches.length) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "searchResult";


    empty.textContent =
      "No matching node";


    empty.style.color =
      "#888";


    searchResults.appendChild(
      empty
    );


    searchResults.style.display =
      "block";


    return;

  }


  matches.forEach(
    node => {

      const result =
        document.createElement(
          "div"
        );


      result.className =
        "searchResult";


      result.textContent =
        node.text;


      /*
       * pointerdown works reliably
       * on both desktop and mobile.
       */
      result.addEventListener(
        "pointerdown",
        event => {

          event.preventDefault();

          event.stopPropagation();


          goToNode(
            node
          );

        }
      );


      searchResults.appendChild(
        result
      );

    }
  );


  searchResults.style.display =
    "block";

}


/* ============================================================
   GO TO SEARCH RESULT
   ============================================================ */

function goToNode(node) {

  /*
   * Expand all parents.
   */
  let parent =
    node.parent;


  while (parent) {

    parent.expanded =
      true;


    parent =
      parent.parent;

  }


  /*
   * Re-render tree.
   */
  render();


  requestAnimationFrame(
    () => {

      centerNode(
        node
      );


      const element =
        document.querySelector(
          `[data-id="${CSS.escape(node.id)}"]`
        );


      if (element) {

        element.classList.add(
          "selected"
        );

      }


      searchResults.style.display =
        "none";


      searchInput.value =
        node.text;

    }
  );

}


/* ============================================================
   FIT
   ============================================================ */

function fit() {

  const width =
    parseFloat(
      svg.getAttribute(
        "width"
      )
    ) || 1;


  const height =
    parseFloat(
      svg.getAttribute(
        "height"
      )
    ) || 1;


  const viewportWidth =
    viewport.clientWidth;


  const viewportHeight =
    viewport.clientHeight;


  const margin =
    window.innerWidth <= 480
      ? 20
      : 40;


  zoom =
    Math.max(
      MIN_ZOOM,

      Math.min(
        1,

        (viewportWidth - margin) /
          width,

        (viewportHeight - margin) /
          height
      )
    );


  ox =
    (
      viewportWidth -
      width * zoom
    ) / 2;


  oy =
    (
      viewportHeight -
      height * zoom
    ) / 2;


  apply();

}


/* ============================================================
   RESET
   ============================================================ */

function resetView() {

  zoom = 1;

  ox = 60;

  oy = 60;

  apply();

}


/* ============================================================
   ZOOM AT SCREEN CENTER
   ============================================================ */

function zoomAtCenter(
  factor
) {

  const x =
    viewport.clientWidth / 2;


  const y =
    viewport.clientHeight / 2;


  zoomAroundPoint(
    factor,
    x,
    y
  );

}


/* ============================================================
   ZOOM AROUND POINT
   ============================================================ */

function zoomAroundPoint(
  factor,
  screenX,
  screenY
) {

  const oldZoom =
    zoom;


  const newZoom =
    Math.max(
      MIN_ZOOM,

      Math.min(
        MAX_ZOOM,

        oldZoom * factor
      )
    );


  if (
    newZoom === oldZoom
  ) {

    return;

  }


  /*
   * Convert screen coordinate
   * to canvas coordinate.
   */
  const contentX =
    (
      screenX - ox
    ) / oldZoom;


  const contentY =
    (
      screenY - oy
    ) / oldZoom;


  zoom =
    newZoom;


  /*
   * Keep that point stationary.
   */
  ox =
    screenX -
    contentX * zoom;


  oy =
    screenY -
    contentY * zoom;


  apply();

}


/* ============================================================
   CENTER NODE
   ============================================================ */

function centerNode(node) {

  const element =
    document.querySelector(
      `[data-id="${CSS.escape(node.id)}"]`
    );


  if (!element) {

    return;

  }


  const box =
    element.getBBox();


  const nodeX =
    box.x +
    box.width / 2;


  const nodeY =
    box.y +
    box.height / 2;


  ox =
    viewport.clientWidth / 2 -
    nodeX * zoom;


  oy =
    viewport.clientHeight / 2 -
    nodeY * zoom;


  apply();


  selectNode(
    node
  );

}


/* ============================================================
   DESKTOP WHEEL ZOOM
   ============================================================ */

viewport.addEventListener(
  "wheel",
  event => {

    event.preventDefault();


    const rect =
      viewport.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    /*
     * Smooth exponential zoom.
     */
    const factor =
      Math.exp(
        -event.deltaY * 0.001
      );


    zoomAroundPoint(
      factor,
      x,
      y
    );

  },
  {
    passive: false
  }
);


/* ============================================================
   POINTER DOWN
   ============================================================ */

viewport.addEventListener(
  "pointerdown",
  event => {

    /*
     * Search UI is independent.
     */
    if (
      event.target.closest(
        "#searchWrapper"
      )
    ) {

      return;

    }


    /*
     * Let nodes receive clicks.
     */
    if (
      event.target.closest(
        ".node"
      )
    ) {

      return;

    }


    pointers.set(
      event.pointerId,
      {

        x:
          event.clientX,

        y:
          event.clientY

      }
    );


    try {

      viewport.setPointerCapture(
        event.pointerId
      );

    }
    catch {}


    /*
     * Two fingers:
     * initialize pinch.
     */
    if (
      pointers.size === 2
    ) {

      lastPinchDistance =
        getPinchDistance();


      lastPinchCenter =
        getPinchCenter();


      lastPanPoint =
        null;


      isDragging =
        false;


      viewport.classList.remove(
        "dragging"
      );


      return;

    }


    /*
     * One finger / mouse.
     */
    lastPanPoint = {

      x:
        event.clientX,

      y:
        event.clientY

    };


    isDragging =
      true;


    viewport.classList.add(
      "dragging"
    );

  }
);


/* ============================================================
   POINTER MOVE
   ============================================================ */

viewport.addEventListener(
  "pointermove",
  event => {

    if (
      !pointers.has(
        event.pointerId
      )
    ) {

      return;

    }


    pointers.set(
      event.pointerId,
      {

        x:
          event.clientX,

        y:
          event.clientY

      }
    );


    /* ========================================================
       TWO FINGER PINCH
       ======================================================== */

    if (
      pointers.size >= 2
    ) {

      const distance =
        getPinchDistance();


      const center =
        getPinchCenter();


      if (
        lastPinchDistance &&
        distance &&
        center
      ) {

        /*
         * Pinch ratio.
         */
        const factor =
          distance /
          lastPinchDistance;


        /*
         * Avoid jitter from tiny changes.
         */
        if (
          Math.abs(
            factor - 1
          ) > 0.002
        ) {

          zoomAroundPoint(
            factor,
            center.x,
            center.y
          );

        }


        /*
         * Two-finger movement also pans.
         */
        if (
          lastPinchCenter
        ) {

          ox +=
            center.x -
            lastPinchCenter.x;


          oy +=
            center.y -
            lastPinchCenter.y;


          apply();

        }

      }


      lastPinchDistance =
        distance;


      lastPinchCenter =
        center;


      return;

    }


    /* ========================================================
       ONE FINGER PAN
       ======================================================== */

    if (
      pointers.size === 1 &&
      isDragging &&
      lastPanPoint
    ) {

      const dx =
        event.clientX -
        lastPanPoint.x;


      const dy =
        event.clientY -
        lastPanPoint.y;


      ox += dx;

      oy += dy;


      lastPanPoint = {

        x:
          event.clientX,

        y:
          event.clientY

      };


      apply();

    }

  }
);


/* ============================================================
   POINTER END
   ============================================================ */

function releasePointer(
  event
) {

  pointers.delete(
    event.pointerId
  );


  if (
    pointers.size < 2
  ) {

    lastPinchDistance =
      null;

    lastPinchCenter =
      null;

  }


  if (
    pointers.size === 0
  ) {

    isDragging =
      false;


    lastPanPoint =
      null;


    viewport.classList.remove(
      "dragging"
    );

  }


  try {

    if (
      viewport.hasPointerCapture(
        event.pointerId
      )
    ) {

      viewport.releasePointerCapture(
        event.pointerId
      );

    }

  }
  catch {}

}


viewport.addEventListener(
  "pointerup",
  releasePointer
);


viewport.addEventListener(
  "pointercancel",
  releasePointer
);


/* ============================================================
   PINCH DISTANCE
   ============================================================ */

function getPinchDistance() {

  const points =
    [...pointers.values()];


  if (
    points.length < 2
  ) {

    return null;

  }


  const dx =
    points[0].x -
    points[1].x;


  const dy =
    points[0].y -
    points[1].y;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* ============================================================
   PINCH CENTER
   ============================================================ */

function getPinchCenter() {

  const points =
    [...pointers.values()];


  if (
    points.length < 2
  ) {

    return null;

  }


  return {

    x:
      (
        points[0].x +
        points[1].x
      ) / 2,


    y:
      (
        points[0].y +
        points[1].y
      ) / 2

  };

}


/* ============================================================
   CLOSE SEARCH
   ============================================================ */

document.addEventListener(
  "pointerdown",
  event => {

    if (
      !event.target.closest(
        "#searchWrapper"
      )
    ) {

      searchResults.style.display =
        "none";

    }

  }
);


/* ============================================================
   WINDOW RESIZE
   ============================================================ */

window.addEventListener(
  "resize",
  () => {

    render();

  }
);


/* ============================================================
   START
   ============================================================ */

load();

</script>

</body>
